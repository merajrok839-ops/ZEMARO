<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <!-- Top Bar Gradient: Yellow to Warm Orange -->
    <linearGradient id="topOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF5A00" />
    </linearGradient>

    <!-- Main Diagonal Gradient: Bright Gold-Yellow to Deep Orange-Red -->
    <linearGradient id="diagOrangeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFC000" />
      <stop offset="30%" stop-color="#FF9500" />
      <stop offset="70%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF4000" />
    </linearGradient>

    <!-- Bottom Left Foot Gradient -->
    <linearGradient id="footOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5100" />
      <stop offset="60%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FFB700" />
    </linearGradient>

    <!-- Blue Triangle Facet Gradient -->
    <linearGradient id="blueFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5599F5" />
      <stop offset="50%" stop-color="#8BBDFB" />
      <stop offset="100%" stop-color="#C2DCFE" />
    </linearGradient>

    <!-- Silver/White Lower Facet Gradient -->
    <linearGradient id="silverFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#EAF2FD" />
      <stop offset="100%" stop-color="#C8DEFD" />
    </linearGradient>
  </defs>

  <!-- ================= 'Z' EMBLEM ================= -->
  <g id="zemaro-emblem" transform="translate(10, 8)">
    <!-- Top Horizontal Bar of 'Z' -->
    <path d="M 22 22 L 102 22 C 104 22 106 23 105 25 L 85 49 L 36 49 C 30 49 26 44 23 39 L 22 22 Z" 
          fill="url(#topOrangeGrad)" />

    <!-- Main Diagonal Slash of 'Z' -->
    <path d="M 76 34 L 100 23 L 34 116 C 30 120 24 122 18 116 L 16 92 L 64 48 L 76 34 Z" 
          fill="url(#diagOrangeGrad)" />

    <!-- Bottom Foot of 'Z' -->
    <path d="M 16 92 L 19 118 C 19 122 24 123 28 120 L 46 95 L 28 85 L 16 92 Z" 
          fill="url(#footOrangeGrad)" />

    <!-- Upper Crystal Blue Facet (Inset polygon) -->
    <polygon points="68,64 94,86 66,86 52,74" 
             fill="url(#blueFacetGrad)" />

    <!-- Lower Reflective Silver-White Facet -->
    <polygon points="56,92 98,92 88,107 46,107" 
             fill="url(#silverFacetGrad)" 
             stroke="#B9D5FC" 
             stroke-width="0.8" />
  </g>

  <!-- ================= 'ZEMARO' TEXT ================= -->
  <text x="145" y="93" 
        fill="#0A1C3E" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="76" 
        font-weight="900" 
        letter-spacing="1.5">ZEMARO</text>
</svg>
